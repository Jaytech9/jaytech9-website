# Cloudflare Pages project for the public website (jaytech9.com).
# Build settings in Cloudflare: build command "npm run build", output folder "dist".
name = "jaytech9-website"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "jaytech9"
database_id = "5be947cb-075e-4828-9dc7-ac63b403da8e"   # same id as in crm/wrangler.toml
