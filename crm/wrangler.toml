# Cloudflare Pages project for the CRM (crm.jaytech9.com).
# Secrets (API keys) are NOT kept here: add them in Cloudflare → jaytech9-crm → Settings → Variables and Secrets.
name = "jaytech9-crm"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-01"

[vars]
SMS_SENDER_ID = "JayTech9"
EMAIL_FROM = "JayTech9 <hello@jaytech9.com>"
# Fill these two in after setting up Cloudflare Access (DEPLOY.md, step 4):
ACCESS_TEAM_DOMAIN = ""        # e.g. "https://jaytech9.cloudflareaccess.com"
ACCESS_AUD = ""                # the Application Audience (AUD) Tag
ADMIN_EMAILS = ""              # e.g. "you@jaytech9.com" (comma-separate several)

[[d1_databases]]
binding = "DB"
database_name = "jaytech9"
database_id = "5be947cb-075e-4828-9dc7-ac63b403da8e"   # from: npx wrangler d1 create jaytech9
