# Scheduled-messages worker. Uses the same database and SMS/email keys as the CRM.
# After deploying, add the secrets once:
#   npx wrangler secret put ARKESEL_API_KEY --config workers/scheduler/wrangler.toml
#   npx wrangler secret put RESEND_API_KEY  --config workers/scheduler/wrangler.toml
name = "jaytech9-scheduler"
main = "index.ts"
compatibility_date = "2026-10-01"

[triggers]
crons = ["*/15 * * * *"]

[vars]
SMS_SENDER_ID = "JayTech9"
EMAIL_FROM = "JayTech9 <hello@jaytech9.com>"

[[d1_databases]]
binding = "DB"
database_name = "jaytech9"
database_id = "5be947cb-075e-4828-9dc7-ac63b403da8e"   # from: npx wrangler d1 create jaytech9
